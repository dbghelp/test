name: read16.yml

on:
  workflow_dispatch:
  schedule:
    - cron: '15 16-23/3 * * *'
    - cron: '15 0-13/3 * * *'

jobs:
  run_script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: read
        run: |
          echo "${{ secrets.LP_KEY }}" > log16.txt
            python -c "from cryptography.fernet import Fernet; import base64; from hashlib import sha256; log16 = open('log16.txt').read().strip(); key = base64.urlsafe_b64encode(sha256(log16.encode()).digest()); open('log16.py', 'wb').write(Fernet(key).decrypt(open('.github/workflows/log16.lp', 'rb').read()))"

      - name: install
        run: |
            python -m pip install --upgrade pip
            pip install beautifulsoup4 requests lxml # Install bs4 and other dependencies
            
      - name: read2
        run: |
          git clone https://x-access-token:${{ secrets.PAT }}@github.com/dbghelp/dbghelp.github.io.git
          if [ -f dbghelp.github.io/time.csv ]; then
            cp dbghelp.github.io/time.csv .
          fi
        
      - name: run
        run: python log16.py

      - name: copy
        run: |
          cp time.csv dbghelp.github.io/

      - name: config
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

      - name: add
        run: |
          cd dbghelp.github.io
          git add time.csv
          git diff --cached --exit-code || git commit -m "Update time.csv"
          git push origin main

      - name: cleanup
        run: |
          rm -rf log16.txt log16.py time.csv dbghelp.github.io
